name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # requirements-lock.txt is the reproducible install: every transitive
      # dependency pinned, generated from a clean venv (see its own header).
      # CI installing anything looser defeats the point of having it.
      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Lint (ruff)
        run: ruff check app tests demo

      - name: Test (pytest)
        run: pytest -q

  pip-check:
    name: requirements.txt / lock consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from requirements.txt (unlocked) as a drift canary
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
