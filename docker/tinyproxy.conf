# Egress allowlist for the PoC sandbox.
#
# The sandbox container has NO direct network route; its only way out is this
# proxy. Only hosts listed under `Allow`/`Filter` can be reached, which is how
# scope is enforced for arbitrary code the static validator cannot fully reason
# about. Edit the filter file per engagement to match your approved scope.

Port 8888
Listen 0.0.0.0
Timeout 30

# Default-deny: connections are refused unless the destination matches the
# filter allowlist below.
Filter "/etc/tinyproxy/allowlist"
FilterDefaultDeny Yes
FilterExtended On

# Never allow CONNECT to internal ranges even if a filter line is too broad.
ConnectPort 443
ConnectPort 80
